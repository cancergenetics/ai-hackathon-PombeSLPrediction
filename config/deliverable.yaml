# Deliverable settings (scripts/predict_all_pairs.py, scripts/linkage_diagnostic.py, scripts/lockbox_eval.py).
# These values do NOT define the evaluation (that is config/protocol.yaml, frozen); they define flags,
# file locations and memory/chunking of the deliverable. Read via src/universe.deliverable_cfg().

genome:
  # PomBase release 2026-10-01 gene coordinates (misc/chromosome_<n>.gene.coords.tsv: id, start, end, strand).
  # Report-only / flag-only: chromosomal distance is NEVER a model feature (DESIGN §1 "Linkage").
  coords_dir: data/raw/pombase_coords
  url_template: https://www.pombase.org/data/releases/pombase-2026-10-01/misc/chromosome_{chrom}.gene.coords.tsv
  chromosomes: [1, 2, 3]
  sha256:
    chromosome_1.gene.coords.tsv: d810e421d41e9f94ffd5ec81521d358f6c35f6121181f31a641a5b535ebe2efc
    chromosome_2.gene.coords.tsv: 1f0aa7e2d778dc6167c08882f55650e4200ba1fb00fdfa9b9fe3f884da549a39
    chromosome_3.gene.coords.tsv: 4ad52f9b07f350a3c28d95f30d361c6c6671228f5fc55e0dc697c3d43a3a8720

linkage:
  # `linked` flag = same chromosome and gap between gene bodies < window_kb. Chosen from
  # scripts/linkage_diagnostic.py (docs/deliverable.md "Linkage"): below 300 kb Ryan measured <= 6% of the
  # design-testable dev pairs (plateau ~77% beyond 800 kb), i.e. such pairs were effectively filtered and
  # the model has no training examples there. 300-600 kb is partially depleted (13-62%); the deliverable
  # also writes the gap itself (same_chrom_gap_kb) so users can apply a stricter window.
  window_kb: 300
  # distance bins (kb, gap between gene bodies) for the diagnostic; last bin is open-ended
  bins_kb: [0, 25, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1000, 1500]
  # coarse bands for the summary (hit rate, Fisher test vs different-chromosome pairs, OOF top-q rate)
  bands_kb: [0, 300, 1000, 1500]

universe:
  # genes scored by the deliverable: the protocol universe (universe_genes.tsv in_universe) plus the
  # unknown-viability genes outside it (viability_unknown_flag), flagged `viability_unknown`
  include_viability_unknown: true

scoring:
  ryan_chunk_pairs: 2000000     # pairs per Ryan-derived (RYAN/NBR/GP) feature build
  lf_chunk_pairs: 500000        # pairs per label-free assembly + prediction block
  threads: 3                    # shared machine: <= 3 threads

oof:
  # dev-CV run whose out-of-fold scores are attached to measured pairs (latest clean registered run of
  # this model on the primary split seed, unless --oof-run is given)
  model: M2
