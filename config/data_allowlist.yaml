    what: "PomBase FYPO phenotype annotations (phenotype_annotations.pombase.phaf.gz, canto_fypo_annotations_with_comments.*, public_api_genotypes_phenotypes.parquet)"
    why: "contain multi-allele / double-mutant (genetic-interaction) phenotypes from fission-yeast GI studies; cannot be cleanly split from single-mutant data. Not downloaded. (Only the FYPO viability table is allowed, as universe-only.)"
    on_disk: false
  biogrid_genetic:
    what: "BioGRID genetic interaction rows (S. pombe and others)"
    why: "fission-yeast GI data from a non-Ryan source (PROMPT.md); includes a copy of Ryan 2012. Deleted after filtering."
    on_disk: false
  pombase_interactions:
    what: "PomBase interactions.tsv / interactions_with_comments.tsv"
    why: "curated genetic interactions (PROMPT.md rule). Not downloaded."
    on_disk: false
  string:
    what: "STRING (any channel) and text-mining-derived networks (GeneMANIA, HumanNet)"
    why: "PROMPT.md: no text mining or derived resources. Not downloaded."
    on_disk: false
  gene_ontology:
    what: "Gene Ontology: GAF, GO slims, GOCAM, PomBase Complex_annotation.tsv, pombase-go-physical-interactions/-substrates, UniProt idmapping GO rows, InterPro2GO, Ryan Table S1 Process Annotations"
    why: "PROMPT.md: no GO. Not downloaded (except the GO rows inside the ID-mapping file, which must not be read)."
    on_disk: false
  net_ff_go_predictions:
    what: "Rodriguez-Lopez 2023 Supplementary file 2 (NET-FF GO predictions) and the phenomics GO enrichments / GO slims / KEGG sheets"
    why: "GO-derived; NET-FF integrates STRING-type networks. Downloaded copy deleted."
    on_disk: false
  koch2012_additional_file2:
    what: "Koch et al. 2012 Additional file 2 (S. pombe SGA control-screen fitness, S. pombe GI degree, GO multifunctionality)"
    why: "PI decision: degree and SMF columns excluded (degree derives from fission-yeast GI screens; GO multifunctionality is GO). Not downloaded."
    on_disk: false
  other_pombe_gi_screens:
    what: "Roguev 2008, Dixon 2008, Frost 2012 and any other fission-yeast GI screen, from any source"
    why: "PROMPT.md: no fission-yeast GI data other than Ryan 2012."
    on_disk: false
  coxpresdb_coex_tables:
    what: "COXPRESdb coex / Spo-u union tables"
    why: "GO/KEGG-scored quality; correlations recomputed from expression matrices instead. Not downloaded."
    on_disk: false
  ryan_derived_tables:
    what: "Ryan Table S2 modules, Dataset S3 similarity, Dataset S4 (see ryan2012 files)"
    why: "derived from the pombe GI matrix (leakage) or superseded."
    on_disk: false

